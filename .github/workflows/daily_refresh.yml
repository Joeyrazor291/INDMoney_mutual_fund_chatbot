name: Daily Data Refresh

on:
  schedule:
    # Run daily at 1:00 AM UTC (6:30 AM IST)
    # This is after the internal 12:30 AM IST scheduler
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Data Ingestion
        run: python phase_5/scheduler/tasks.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit and Sync Changes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 1. Add Hugging Face as a remote
          git remote add huggingface https://Joeyrazor291:$HF_TOKEN@huggingface.co/spaces/Joeyrazor/indmoney-backend.git
          
          # 2. Fetch Hugging Face history to avoid "shallow" and "unrelated" errors
          git fetch huggingface main
          
          # 3. Stage and Commit new data
          git add data/ refresh_logs/
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated daily data refresh [skip ci]"
            
            # 4. Push to GitHub
            git push origin main
            
            # 5. Push to Hugging Face (now with shared history)
            git push --force huggingface main
          else
            # Even if no data changes, ensure HF is in sync with GitHub code
            git push --force huggingface main
          fi
