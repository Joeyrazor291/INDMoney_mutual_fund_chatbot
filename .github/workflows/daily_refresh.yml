name: Daily Data Refresh

on:
  schedule:
    # Run daily at 1:00 AM UTC (6:30 AM IST)
    # This is after the internal 12:30 AM IST scheduler
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Data Ingestion
        run: python phase_5/scheduler/tasks.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit and Sync Changes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 1. Commit and Push data updates to GitHub (Standard limit is 100MB, so this is fine)
          git add data/ refresh_logs/
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated daily data refresh [skip ci]"
            git pull origin main --rebase
            git push origin main
          else
            echo "No data changes to commit to GitHub."
          fi

          # 2. Sync to Hugging Face using the API (Handles large files and LFS automatically)
          echo "Starting API-based sync to Hugging Face..."
          python phase_5/scheduler/sync_to_hf.py
