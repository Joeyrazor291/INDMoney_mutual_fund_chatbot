services:
  - type: web
    name: indmoney-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn phase_4.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set in Render dashboard
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: 3.10.0
