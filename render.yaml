services:
  - type: web
    name: indmoney-backend
    env: python
    buildCommand: "pip install -r phase_4/backend/requirements.txt"
    startCommand: "uvicorn phase_4.backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GROQ_API_KEY
        sync: false
